  <style>
    :root {
      --bg: #09070b;
      --card: rgba(18,14,20,.88);
      --pink: #ff3f91;
      --light: #ff9ec7;
      --gold: #ffd68a;
      --white: #ffffff;
      --muted: #bdb5c1;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--white);
      background: var(--bg);
      font-family: "Poppins", Arial, sans-serif;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,63,145,.2), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(255,214,138,.1), transparent 28%),
        linear-gradient(145deg, #050406 0%, #120912 52%, #070608 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, #000, transparent 90%);
    }

    .glow {
      position: absolute;
      z-index: -1;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(255,63,145,.2);
      filter: blur(90px);
      animation: floatGlow 7s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -150px;
      right: -100px;
    }

    .glow.two {
      bottom: -170px;
      left: -120px;
      opacity: .45;
      animation-delay: -3s;
    }

    .card {
      width: min(470px, 100%);
      padding: 42px 36px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 30px;
      background: var(--card);
      box-shadow:
        0 30px 80px rgba(0,0,0,.58),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: cardIn .8s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 24px;
      padding: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--pink), var(--light));
      box-shadow:
        0 0 0 8px rgba(255,63,145,.08),
        0 18px 45px rgba(255,63,145,.22);
    }

    .logo-wrap::after {
      content: "18+";
      position: absolute;
      right: -8px;
      bottom: 4px;
      min-width: 43px;
      height: 43px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      border: 3px solid #151017;
      border-radius: 50%;
      color: #1a1015;
      background: linear-gradient(135deg, #fff0f6, var(--light));
      font-size: 13px;
      font-weight: 900;
    }

    .logo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 35%;
      border: 5px solid #151017;
      border-radius: 50%;
      background: #21151f;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--light);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 62px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(95deg, var(--pink), #ffb1d3 52%, var(--gold));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      max-width: 350px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .cta {
      position: relative;
      width: 100%;
      margin-top: 28px;
      padding: 17px 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 16px;
      color: #ffffff;
      background: linear-gradient(100deg, #e91470, #ff3f91 48%, #c32d92);
      box-shadow: 0 15px 35px rgba(255,63,145,.28);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .4px;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 55%;
      height: 100%;
      transform: skewX(-24deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
      );
      animation: shine 3.2s ease-in-out infinite;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 20px 45px rgba(255,63,145,.42);
      outline: none;
    }

    .cta:active {
      transform: scale(.98);
    }

    .cta svg,
    .cta span {
      position: relative;
      z-index: 1;
    }

    .cta svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .notice {
      margin: 18px 0 0;
      color: #918a95;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #807881;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .footer strong {
      color: #d7cfd9;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shine {
      0%, 55% { left: -100%; }
      85%, 100% { left: 150%; }
    }

    @keyframes floatGlow {
      from {
        transform: translate3d(0,0,0) scale(1);
      }
      to {
        transform: translate3d(35px,25px,0) scale(1.15);
      }
    }

    @media (max-width: 520px) {
      .page {
        padding: 16px;
      }

      .card {
        padding: 34px 22px 24px;
        border-radius: 25px;
      }

      .logo-wrap {
        width: 112px;
        height: 112px;
      }

      h1 {
        font-size: clamp(40px, 14vw, 54px);
        letter-spacing: -2.5px;
      }

      .subtitle {
        font-size: 14px;
      }

      .cta {
        padding: 16px 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
