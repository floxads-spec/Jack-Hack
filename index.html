  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07030d">
  <title>JACK HACK</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #07030d;
      font-family: "Poppins", sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .jack-hack-page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 30px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,0,119,.30), transparent 32%),
        radial-gradient(circle at 88% 82%, rgba(0,174,255,.25), transparent 34%),
        linear-gradient(145deg, #050208, #12051d 52%, #020812);
    }

    .jack-grid {
      position: absolute;
      inset: -70%;
      z-index: -5;
      width: 240%;
      height: 240%;
      opacity: .16;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(650px) rotateX(62deg);
      animation: jackGrid 14s linear infinite;
    }

    .jack-glow {
      position: absolute;
      z-index: -4;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .30;
      pointer-events: none;
    }

    .jack-glow-pink {
      top: -190px;
      left: -140px;
      background: #ff0077;
      animation: pinkGlow 9s ease-in-out infinite alternate;
    }

    .jack-glow-blue {
      right: -170px;
      bottom: -200px;
      background: #00aeff;
      animation: blueGlow 11s ease-in-out infinite alternate;
    }

    .jack-particle {
      position: absolute;
      bottom: -25px;
      z-index: -2;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 14px #ff2d8d;
      opacity: 0;
      pointer-events: none;
      animation: jackParticle 8s linear infinite;
    }

    .particle-one {
      left: 10%;
    }

    .particle-two {
      left: 29%;
      animation-delay: 2s;
    }

    .particle-three {
      left: 52%;
      animation-delay: 4s;
    }

    .particle-four {
      left: 76%;
      animation-delay: 1s;
    }

    .particle-five {
      left: 92%;
      animation-delay: 5s;
    }

    .jack-card {
      position: relative;
      width: 100%;
      max-width: 1050px;
      min-height: min(650px, calc(100svh - 60px));
      padding: clamp(40px, 7vw, 80px);
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: clamp(35px, 6vw, 75px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 34px;
      background: rgba(15,8,25,.80);
      box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: cardEntry .8s ease both;
    }

    .jack-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #ff2d8d,
        #18c8ff,
        transparent
      );
      box-shadow: 0 0 20px rgba(255,45,141,.75);
    }

    .jack-content {
      position: relative;
      z-index: 5;
    }

    .jack-badge {
      width: fit-content;
      margin-bottom: 24px;
      padding: 8px 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,45,141,.42);
      border-radius: 999px;
      color: #ffd8eb;
      background: rgba(255,45,141,.08);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .jack-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2d8d;
      box-shadow: 0 0 12px #ff2d8d;
      animation: jackBlink 1.3s ease-in-out infinite;
    }

    .jack-title {
      margin: 0;
      font-size: clamp(58px, 9vw, 112px);
      line-height: .90;
      font-weight: 900;
      letter-spacing: -6px;
      text-transform: uppercase;
      text-shadow: 0 12px 35px rgba(0,0,0,.5);
    }

    .jack-title span {
      display: block;
      color: transparent;
      background: linear-gradient(
        100deg,
        #ff2d8d,
        #ff8bc3 34%,
        #ffffff 53%,
        #18c8ff
      );
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .jack-description {
      max-width: 540px;
      margin: 25px 0 0;
      color: #b9afc8;
      font-size: 16px;
      line-height: 1.75;
    }

    .jack-button {
      position: relative;
      width: fit-content;
      margin-top: 32px;
      padding: 16px 27px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.70);
      border-radius: 999px;
      color: #ffffff;
      background: linear-gradient(
        95deg,
        #f00073,
        #8c52ff,
        #008fc7
      );
      box-shadow:
        0 16px 38px rgba(255,45,141,.30),
        inset 0 1px rgba(255,255,255,.30);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .8px;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .3s ease, box-shadow .3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .jack-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 55%;
      height: 100%;
      transform: skewX(-24deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.55),
        transparent
      );
      animation: buttonShine 3s ease-in-out infinite;
    }

    .jack-button:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow:
        0 21px 48px rgba(255,45,141,.45),
        0 0 28px rgba(24,200,255,.20);
    }

    .jack-button:active {
      transform: scale(.97);
    }

    .jack-button svg,
    .jack-button span {
      position: relative;
      z-index: 2;
    }

    .jack-button svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .jack-notice {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.52);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .jack-notice-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff2d8d;
      box-shadow: 0 0 9px #ff2d8d;
    }

    .jack-visual {
      position: relative;
      min-height: 430px;
      display: grid;
      place-items: center;
    }

    .jack-logo-ring {
      position: absolute;
      width: 360px;
      height: 360px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50%;
      animation: ringRotate 16s linear infinite;
    }

    .jack-logo-ring::before,
    .jack-logo-ring::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .jack-logo-ring::before {
      inset: 22px;
      border: 2px dashed rgba(255,45,141,.35);
    }

    .jack-logo-ring::after {
      inset: -7px;
      border-top: 3px solid #ff2d8d;
      border-right: 3px solid transparent;
      border-bottom: 3px solid #18c8ff;
      border-left: 3px solid transparent;
      filter: drop-shadow(0 0 8px rgba(255,45,141,.7));
    }

    .jack-profile-logo {
      position: relative;
      z-index: 4;
      width: 270px;
      height: 270px;
      padding: 6px;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #ff2d8d,
        #8c52ff,
        #18c8ff
      );
      box-shadow:
        0 0 0 10px rgba(255,255,255,.035),
        0 0 65px rgba(255,45,141,.35),
        0 0 95px rgba(24,200,255,.15);
      animation: logoFloat 4s ease-in-out infinite;
    }

    .jack-profile-logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
      background: #09050e;
    }

    .jack-live-status {
      position: absolute;
      z-index: 5;
      right: 35px;
      bottom: 60px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(7,3,11,.88);
      box-shadow: 0 8px 22px rgba(0,0,0,.45);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .jack-live-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #50f29a;
      box-shadow: 0 0 10px #50f29a;
      animation: jackBlink 1.3s ease-in-out infinite;
    }

    .jack-footer {
      position: absolute;
      right: 28px;
      bottom: 20px;
      color: rgba(255,255,255,.36);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .jack-footer strong {
      color: #ff76b6;
    }

    @keyframes jackGrid {
      to {
        background-position: 0 100px;
      }
    }

    @keyframes pinkGlow {
      to {
        transform: translate(80px,55px) scale(1.15);
      }
    }

    @keyframes blueGlow {
      to {
        transform: translate(-75px,-50px) scale(.9);
      }
    }

    @keyframes jackParticle {
      0% {
        transform: translateY(0) scale(.4);
        opacity: 0;
      }

      18% {
        opacity: .7;
      }

      100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
      }
    }

    @keyframes cardEntry {
      from {
        opacity: 0;
        transform: translateY(26px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes jackBlink {
      50% {
        opacity: .35;
      }
    }

    @keyframes buttonShine {
      0%,
      35% {
        left: -120%;
      }

      70%,
      100% {
        left: 150%;
      }
    }

    @keyframes ringRotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-11px);
      }
    }

    @media (max-width: 850px) {
      .jack-hack-page {
        display: block;
        min-height: 100svh;
        padding: 16px;
        overflow-y: auto;
      }

      .jack-card {
        min-height: 0;
        padding: 48px 25px 65px;
        grid-template-columns: 1fr;
        gap: 40px;
        border-radius: 26px;
      }

      .jack-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .jack-title {
        font-size: clamp(55px, 16vw, 92px);
        letter-spacing: -4px;
      }

      .jack-description {
        margin-top: 21px;
      }

      .jack-button {
        width: 100%;
        max-width: 350px;
      }

      .jack-notice {
        justify-content: center;
        flex-wrap: wrap;
      }

      .jack-visual {
        min-height: 340px;
      }

      .jack-logo-ring {
        width: 285px;
        height: 285px;
      }

      .jack-profile-logo {
        width: 215px;
        height: 215px;
      }

      .jack-live-status {
        right: calc(50% - 130px);
        bottom: 35px;
      }

      .jack-footer {
        right: 0;
        left: 0;
        bottom: 20px;
        text-align: center;
      }
    }

    @media (max-width: 420px) {
      .jack-hack-page {
        padding: 10px;
      }

      .jack-card {
        padding: 40px 18px 62px;
        gap: 30px;
      }

      .jack-badge {
        margin-bottom: 20px;
        font-size: 10px;
      }

      .jack-title {
        font-size: clamp(49px, 17vw, 70px);
      }

      .jack-description {
        font-size: 14px;
        line-height: 1.7;
      }

      .jack-button {
        padding: 15px 18px;
        font-size: 13px;
      }

      .jack-notice {
        font-size: 10px;
      }

      .jack-visual {
        min-height: 285px;
      }

      .jack-logo-ring {
        width: 235px;
        height: 235px;
      }

      .jack-profile-logo {
        width: 178px;
        height: 178px;
      }

      .jack-live-status {
        right: calc(50% - 111px);
        bottom: 23px;
      }
    }
  </style>
</head>
